async function loadState(){
  try{
    const raw = window.localStorage.getItem('pm-training-state');
    if(raw){
      const d = JSON.parse(raw);
      traineeName = d.traineeName || "";
      firstName = d.firstName || "";
      lastName = d.lastName || "";
      scores = d.scores || scores;
      quizAnswerLogs = d.quizAnswerLogs || quizAnswerLogs;
      pacedReading = d.pacedReading !== undefined ? d.pacedReading : true;
      readSpeed = d.readSpeed !== undefined ? d.readSpeed : 1;
      videoCompleted = d.videoCompleted || false;
      assignedCredential = d.assignedCredential || null;
      assignedUnit = d.assignedUnit || null;
      completionReportSent = d.completionReportSent || false;
    }
  }catch(e){ /* no saved state yet, or storage unavailable */ }
}
async function saveState(){
  try{
    window.localStorage.setItem('pm-training-state', JSON.stringify({traineeName, firstName, lastName, scores, quizAnswerLogs, pacedReading, readSpeed, videoCompleted, assignedCredential, assignedUnit, completionReportSent}));
  }catch(e){ console.error('save failed', e); }
}

const app = document.getElementById('app');

function escapeHtml(s){
  return (s||"").replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function buildMailto(subject, body){
  return `mailto:${REPORT_EMAIL}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
}

// Sends a completed quiz attempt (name, score, pass/fail, and full answer log) to a
// Netlify serverless function, which commits it to the GitHub repo as a JSON file.
// The GitHub token lives only in the Netlify function's environment — never in this
// client-side code — so it can't be extracted from the page source.
async function recordResultToGit(testNum, score, passed, answerLog){
  try{
    const res = await fetch('/.netlify/functions/record-result', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        name: traineeName,
        testNum,
        score,
        passed,
        timestamp: new Date().toISOString(),
        answers: answerLog
      })
    });
    if(!res.ok){
      const errBody = await res.text();
      console.error('recordResultToGit: server responded with an error', res.status, errBody);
    }
  }catch(e){
    console.error('recordResultToGit: failed to reach the recording function', e);
  }
}

function renderNameGate(){
  app.innerHTML = `
    <div class="card name-card">
      <h2 style="color:var(--navy);margin-top:0;">Welcome</h2>
      <p>Please enter your name to begin the training. This will be used to identify your test reports. This is the name that will appear on your PM certificate and should be your legal name.</p>
      <input id="firstNameInput" type="text" placeholder="First name" value="${escapeHtml(firstName)}">
      <input id="lastNameInput" type="text" placeholder="Last name" value="${escapeHtml(lastName)}">
      <br>
      <button class="btn-primary" id="startBtn">Start Training</button>
    </div>`;
  document.getElementById('startBtn').onclick = async ()=>{
    const fn = document.getElementById('firstNameInput').value.trim();
    const ln = document.getElementById('lastNameInput').value.trim();
    if(!fn || !ln){ alert('Please enter both your first and last name.'); return; }
    firstName = fn;
    lastName = ln;
    traineeName = `${fn} ${ln}`;
    if(!assignedCredential){
      assignedCredential = CREDENTIALS[Math.floor(Math.random() * CREDENTIALS.length)];
    }
    if(!assignedUnit){
      assignedUnit = UNIT_NUMBERS[Math.floor(Math.random() * UNIT_NUMBERS.length)];
    }
    await saveState();
    render();
  };
}

function renderSlide(){
  const s = slides[current];
  const pct = Math.round((current/(slides.length-1))*100);
  let inner = `<div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>`;

  if(s.type === "title"){
    inner += `<div class="card section-card">
      <h2>${escapeHtml(s.title)}</h2>
      <p style="color:var(--ice);font-size:16px;margin-top:10px;">${escapeHtml(s.sub)}</p>
      <p style="margin-top:20px;font-size:14px;">${escapeHtml(s.body)}</p>
    </div>`;
  } else if(s.type === "section"){
    inner += `<div class="card section-card">
      <p style="color:var(--ice);letter-spacing:1px;margin:0;">${escapeHtml(s.title)}</p>
      <h2 style="margin-top:6px;">${escapeHtml(s.sub)}</h2>
    </div>`;
  } else if(s.type === "content"){
    inner += `<div class="card"><div class="slide-title">${escapeHtml(s.title)}</div>`;
    if(s.intro){
      inner += `<p class="body-text reveal-item" style="font-style:italic;color:var(--gray);">${escapeHtml(s.intro)}</p>`;
    }
    if(s.showCredentials && assignedCredential){
      inner += `<div class="credential-box">
        <strong>Your training login for this course:</strong>
        <div class="cred-row"><span>Name:</span> ${escapeHtml(assignedCredential.name)}</div>
        <div class="cred-row"><span>Username:</span> ${escapeHtml(assignedCredential.username)}</div>
        <div class="cred-row"><span>Password:</span> ${escapeHtml(assignedCredential.password)}</div>
      </div>`;
    }
    if(s.showAssignment && assignedUnit){
      inner += `<div class="credential-box">
        <strong>Your assigned unit number:</strong>
        <div class="cred-row"><span>Unit #:</span> ${escapeHtml(assignedUnit)}</div>
      </div>`;
    }
    const galleryHtml = s.images ? `<div class="gallery${s.imageStyle==='banner' ? ' banner' : ''}">` + s.images.map(k=>`<img src="${IMG[k]}" data-full="${IMG[k]}" onclick="openLightbox(this.dataset.full)">`).join('') + `</div>` : '';
    if(s.images && s.imagePosition !== "bottom"){
      inner += galleryHtml;
    }
    if(s.video){
      inner += `<video class="class-video" controls src="${s.video}">Your browser does not support embedded video. The video file (${s.video}) must be saved in the same folder as this page.</video>`;
    }
    if(s.youtube){
      inner += s.youtube.map(id=>`<iframe class="yt" src="https://www.youtube.com/embed/${id}" title="Reference video" allowfullscreen></iframe>`).join('');
    }
    if(s.sections){
      s.sections.forEach(sec=>{
        const body = sec[1];
        let bodyHtml;
        if(Array.isArray(body)){
          bodyHtml = `<ul class="sub-list">` + body.map(item=>{
            if(item && typeof item === "object" && item.num){
              return `<li>${item.num}. ${escapeHtml(item.text)}</li>`;
            }
            return `<li>${escapeHtml(item)}</li>`;
          }).join('') + `</ul>`;
        } else {
          bodyHtml = `<p class="body-text">${escapeHtml(body)}</p>`;
        }
        inner += `<div class="reveal-item"><div class="slide-sub">${escapeHtml(sec[0])}</div>${bodyHtml}</div>`;
      });
    }
    if(s.bullets){
      inner += `<ul>` + s.bullets.map(b=>`<li class="reveal-item">${escapeHtml(b)}</li>`).join('') + `</ul>`;
    }
    if(s.body){
      if(s.imageWithLastLine && s.images && s.imagePosition === "bottom"){
        inner += `<div class="reveal-item"><p class="body-text">${escapeHtml(s.body)}</p>${galleryHtml}</div>`;
      } else {
        inner += `<p class="body-text reveal-item">${escapeHtml(s.body)}</p>`;
      }
    }
    if(s.images && s.imagePosition === "bottom" && !(s.imageWithLastLine && s.body)){
      inner += galleryHtml;
    }
    inner += `</div>`;
  } else if(s.type === "steps"){
    inner += `<div class="card"><div class="slide-title">${escapeHtml(s.title)}</div>`;
    if(s.videoResource){
      inner += `<a class="video-resource-link" onclick="openVideoModal('${s.videoResource.file}', '${escapeHtml(s.videoResource.description).replace(/'/g, "&#39;")}')">&#9654; Watch Video<span class="vrl-tooltip">${escapeHtml(s.videoResource.description)}</span></a>`;
    }
    if(s.intro){
      inner += `<p class="body-text reveal-item" style="font-style:italic;color:var(--gray);">${escapeHtml(s.intro)}</p>`;
    }
    const renderStepRow = (step, num)=>{
      const imgKeys = step.images ? step.images : (step.image ? [step.image] : []);
      const imgsHtml = imgKeys.map(k=>`<img class="step-img" src="${IMG[k]}" data-full="${IMG[k]}" onclick="openLightbox(this.dataset.full)">`).join('');
      const noteHtml = step.note ? `<div class="step-note">${escapeHtml(step.note)}</div>` : '';
      return `<div class="step-row reveal-item">
        <div class="step-num">${num}</div>
        <div class="step-text">${escapeHtml(step.text)}${noteHtml}</div>
        ${imgsHtml}
      </div>`;
    };
    s.steps.forEach((step, idx)=>{ inner += renderStepRow(step, idx+1); });
    if(s.video){
      const doneAlready = videoCompleted;
      inner += `<div class="video-locked-note ${doneAlready?'done':''}" id="videoLockNote">${doneAlready ? 'Video watched — you may continue.' : escapeHtml(s.videoCaption || 'You must watch the full video before continuing.')}</div>`;
      inner += `<video class="class-video" id="gatedVideo" controls controlsList="nofastforward noplaybackrate" disablePictureInPicture src="${s.video}">Your browser does not support embedded video. The video file (${s.video}) must be saved in the same folder as this page.</video>`;
    }
    if(s.stepsAfter){
      const offset = s.steps.length;
      s.stepsAfter.forEach((step, idx)=>{ inner += renderStepRow(step, offset+idx+1); });
    }
    inner += `</div>`;
  } else if(s.type === "test"){
    const qData = QUIZZES[s.testNum];
    const existingScore = scores[s.testNum];
    const passed = existingScore !== null && existingScore !== undefined && existingScore >= 80;
    inner += `<div class="card test-box">
      <h2>${escapeHtml(s.title)}</h2>
      <p>Answer all ${qData.length} questions below. You need <strong>80%</strong> or higher to continue. Your name, score, and answers are recorded automatically when you submit.</p>
      ${passed ? `<div class="video-locked-note done">You already passed this test (${existingScore}%). You may continue to the next slide.</div>` : ''}
      <div id="quizQuestions">` +
      qData.map((item, qi)=>`
        <div class="quiz-question" style="text-align:left;background:#fbf6f2;border-radius:8px;padding:14px 16px;margin-bottom:12px;">
          <p style="font-weight:bold;margin:0 0 8px;">${qi+1}. ${escapeHtml(item.q)}</p>
          ${item.options.map((opt,oi)=>`<label style="display:block;padding:5px 0;cursor:pointer;font-weight:normal;">
            <input type="radio" name="q-${s.testNum}-${qi}" value="${oi}" ${passed?'disabled':''}> ${escapeHtml(opt)}
          </label>`).join('')}
        </div>`).join('') +
      `</div>
      <div id="resultMsg"></div>
      ${passed ? '' : `<button class="btn-primary" id="submitQuizBtn" style="margin-top:6px;">Submit Test</button>`}
    </div>`;
  } else if(s.type === "final"){
    const allPassed = scores[1]>=80 && scores[2]>=80 && scores[3]>=80;
    inner += `<div class="card final-card">
      <div class="slide-title" style="text-align:center;">${escapeHtml(s.title)}</div>
      <p class="body-text">${escapeHtml(s.body)}</p>
      <p class="body-text"><strong>Contact:</strong> ${escapeHtml(s.contact)}</p>
      <div class="score-summary">
        Test 1: ${scores[1] ?? "not taken"}% &nbsp;|&nbsp;
        Test 2: ${scores[2] ?? "not taken"}% &nbsp;|&nbsp;
        Test 3: ${scores[3] ?? "not taken"}%
      </div>
      <div class="video-locked-note ${completionReportSent ? 'done' : ''}" id="completionNote">${completionReportSent ? 'Your course completion report has been emailed to Kelby.' : 'Click below to email your final course report (all three test scores) to Kelby.'}</div>
      <button class="schedule-btn" id="completionReportBtn">Email My Course Results</button>
      ${allPassed ? `<button class="schedule-btn" id="scheduleBtn" style="margin-left:10px;">Request In-Person Training</button>
        <p style="font-size:13px;color:var(--gray);margin-top:8px;">All three tests passed (80%+). Click above to send a pre-filled scheduling request to Kelby.</p>`
        : `<div class="gate">All three section tests must be passed at 80% or higher before requesting in-person training scheduling. Go back and complete any remaining or failed tests.</div>`}
    </div>`;
  }

  const textHold = ((s.type === "content" || s.type === "steps") && pacedReading);
  const videoHold = (s.type === "steps" && s.video && s.lockVideo && !videoCompleted);
  const scoreHold = (s.type === "test" && (scores[s.testNum] === null || scores[s.testNum] === undefined));
  const holdNext = textHold || videoHold || scoreHold;
  inner += `<div class="nav">
    <button class="btn-secondary" id="prevBtn" ${current===0?'disabled':''}>&larr; Previous</button>
    <span class="slide-counter" id="slideCounter">Slide ${current+1} of ${slides.length}${traineeName ? " — " + escapeHtml(traineeName) : ""}${videoHold ? " — watch the full video to continue" : (textHold ? " — finish reading to continue" : (scoreHold ? " — enter your score to continue" : ""))}</span>
    <button class="btn-primary" id="nextBtn" ${(current===slides.length-1 || holdNext)?'disabled':''}>Next &rarr;</button>
  </div>`;

  app.innerHTML = inner;

  if(s.type === "content" || s.type === "steps"){
    scheduleReveal();
  }
  if(s.type === "steps" && s.video){
    setupGatedVideo(s);
  }

  document.getElementById('prevBtn').onclick = ()=>{ if(current>0){ current--; render(); } };
  document.getElementById('nextBtn').onclick = ()=>{ if(current<slides.length-1){ current++; render(); } };

  if(s.type === "test"){
    const submitBtn = document.getElementById('submitQuizBtn');
    if(submitBtn){
      submitBtn.onclick = async ()=>{
        const qData = QUIZZES[s.testNum];
        let allAnswered = true;
        let correct = 0;
        const answerLog = [];

        qData.forEach((item, qi)=>{
          const sel = document.querySelector(`input[name="q-${s.testNum}-${qi}"]:checked`);
          if(!sel){ allAnswered = false; return; }
          const chosenIdx = parseInt(sel.value, 10);
          const isCorrect = chosenIdx === item.answer;
          if(isCorrect){ correct++; }
          answerLog.push({
            question: item.q,
            selected: item.options[chosenIdx],
            correctAnswer: item.options[item.answer],
            isCorrect
          });
        });

        if(!allAnswered){
          alert('Please answer every question before submitting.');
          return;
        }

        const pct = Math.round((correct / qData.length) * 100);
        const didPass = pct >= Math.round(QUIZ_PASS_THRESHOLD * 100);

        scores[s.testNum] = pct;
        quizAnswerLogs[s.testNum] = answerLog;
        await saveState();

        // Lock in the answers visually so they can't be edited post-grading
        document.querySelectorAll('#quizQuestions input[type="radio"]').forEach(el => el.disabled = true);
        submitBtn.disabled = true;

        const msg = document.getElementById('resultMsg');
        msg.className = 'result-msg ' + (didPass ? 'pass' : 'fail');
        msg.textContent = didPass
          ? `Score: ${pct}%. Passed! Your name, score, and answers have been recorded.`
          : `Score: ${pct}%. Not a passing score (80% required). Your attempt has been recorded. Reload this slide to retake the quiz before continuing.`;

        // Record this attempt to the GitHub-backed results log via the Netlify function.
        // This is fire-and-forget from the UI's perspective — a failure here does not
        // block the trainee locally, but is logged to the console for troubleshooting.
        recordResultToGit(s.testNum, pct, didPass, answerLog);

        const nextBtn = document.getElementById('nextBtn');
        const counter = document.getElementById('slideCounter');
        if(didPass){
          if(nextBtn && current < slides.length - 1){ nextBtn.disabled = false; }
          if(counter){ counter.textContent = `Slide ${current+1} of ${slides.length}${traineeName ? " — " + traineeName : ""}`; }
        } else {
          // Give the retake button a moment to be readable, then re-render for a clean retry.
          const retakeBtn = document.createElement('button');
          retakeBtn.className = 'btn-secondary';
          retakeBtn.style.marginTop = '10px';
          retakeBtn.textContent = 'Retake Quiz';
          retakeBtn.onclick = ()=>{ scores[s.testNum] = null; renderSlide(); };
          msg.after(retakeBtn);
        }
      };
    }
  }
  if(s.type === "final"){
    const btn = document.getElementById('scheduleBtn');
    if(btn){ btn.onclick = ()=> sendScheduleRequest(); }
    const reportBtn = document.getElementById('completionReportBtn');
    if(reportBtn){
      reportBtn.onclick = async ()=>{
        completionReportSent = true;
        await saveState();
        sendCompletionReport();
        const note = document.getElementById('completionNote');
        if(note){
          note.textContent = 'Your course completion report has been emailed to Kelby.';
          note.classList.add('done');
        }
      };
    }
  }
}

function render(){
  if(!traineeName){ renderNameGate(); return; }
  if(!assignedCredential){ assignedCredential = CREDENTIALS[Math.floor(Math.random() * CREDENTIALS.length)]; saveState(); }
  if(!assignedUnit){ assignedUnit = UNIT_NUMBERS[Math.floor(Math.random() * UNIT_NUMBERS.length)]; saveState(); }
  renderSlide();
}

function scheduleReveal(){
  const items = app.querySelectorAll('.reveal-item');
  const nextBtn = document.getElementById('nextBtn');
  const counter = document.getElementById('slideCounter');
  const s = slides[current];
  const stillVideoLocked = (s.type === "steps" && s.video && s.lockVideo && !videoCompleted);
  const finishHold = ()=>{
    if(stillVideoLocked){
      if(counter){ counter.textContent = `Slide ${current+1} of ${slides.length}${traineeName ? " — " + traineeName : ""} — watch the full video to continue`; }
      return;
    }
    if(nextBtn && current < slides.length - 1){ nextBtn.disabled = false; }
    if(counter){ counter.textContent = `Slide ${current+1} of ${slides.length}${traineeName ? " — " + traineeName : ""}`; }
  };
  if(!pacedReading){
    items.forEach(el=> el.classList.add('visible'));
    return;
  }
  if(items.length === 0){
    finishHold();
    return;
  }
  const WPM = 200 * readSpeed; // average adult reading speed, scaled by chosen speed
  let elapsed = 0;
  items.forEach((el, idx)=>{
    const words = (el.textContent || "").trim().split(/\s+/).filter(Boolean).length;
    const readMs = Math.max(600, Math.round((words / WPM) * 60000));
    setTimeout(()=>{
      el.classList.add('visible');
      if(idx === items.length - 1){ finishHold(); }
    }, elapsed);
    elapsed += readMs;
  });
}

document.addEventListener('DOMContentLoaded', ()=>{
  const toggle = document.getElementById('paceToggle');
  if(toggle){
    toggle.checked = pacedReading;
    toggle.addEventListener('change', async ()=>{
      pacedReading = toggle.checked;
      await saveState();
      if(traineeName){ renderSlide(); }
    });
  }
  const SPEED_STEPS = [1, 1.5, 2];
  const slider = document.getElementById('speedSlider');
  const speedLabel = document.getElementById('speedLabel');
  if(slider){
    slider.value = String(SPEED_STEPS.indexOf(readSpeed) >= 0 ? SPEED_STEPS.indexOf(readSpeed) : 0);
    if(speedLabel){ speedLabel.textContent = readSpeed + "x"; }
    slider.addEventListener('input', async ()=>{
      readSpeed = SPEED_STEPS[parseInt(slider.value, 10)];
      if(speedLabel){ speedLabel.textContent = readSpeed + "x"; }
      await saveState();
      if(traineeName){ renderSlide(); }
    });
  }
});

function setupGatedVideo(s){
  const video = document.getElementById('gatedVideo');
  if(!video) return;
  const nextBtn = document.getElementById('nextBtn');
  const counter = document.getElementById('slideCounter');
  const note = document.getElementById('videoLockNote');

  if(videoCompleted){
    return; // already watched in a prior session; nav buttons already unlocked by render
  }

  let maxWatched = 0;

  video.addEventListener('timeupdate', ()=>{
    if(video.currentTime > maxWatched + 0.5){
      // user is somehow ahead of watched progress (shouldn't happen, but guard anyway)
      video.currentTime = maxWatched;
    } else {
      maxWatched = Math.max(maxWatched, video.currentTime);
    }
  });

  video.addEventListener('seeking', ()=>{
    if(video.currentTime > maxWatched + 0.5){
      video.currentTime = maxWatched;
    }
  });

  video.addEventListener('ratechange', ()=>{
    if(video.playbackRate !== 1){ video.playbackRate = 1; }
  });

  video.addEventListener('ended', async ()=>{
    videoCompleted = true;
    await saveState();
    if(note){
      note.textContent = 'Video watched — you may continue.';
      note.classList.add('done');
    }
    // only unlock Next if text reveal (if any) has also finished
    const textHold = ((s.type === "content" || s.type === "steps") && pacedReading && app.querySelectorAll('.reveal-item:not(.visible)').length > 0);
    if(nextBtn && !textHold && current < slides.length - 1){ nextBtn.disabled = false; }
    if(counter){ counter.textContent = `Slide ${current+1} of ${slides.length}${traineeName ? " — " + traineeName : ""}`; }
  });
}

function openVideoModal(file, description){
  const overlay = document.getElementById('videoModalOverlay');
  const player = document.getElementById('videoModalPlayer');
  const desc = document.getElementById('videoModalDesc');
  desc.textContent = description;
  player.src = file;
  overlay.classList.add('open');
}
function closeVideoModal(){
  const overlay = document.getElementById('videoModalOverlay');
  const player = document.getElementById('videoModalPlayer');
  player.pause();
  player.removeAttribute('src');
  player.load();
  overlay.classList.remove('open');
}
document.addEventListener('DOMContentLoaded', ()=>{
  const closeBtn = document.getElementById('videoModalClose');
  const overlay = document.getElementById('videoModalOverlay');
  if(closeBtn){ closeBtn.addEventListener('click', closeVideoModal); }
  if(overlay){
    overlay.addEventListener('click', (e)=>{
      if(e.target === overlay){ closeVideoModal(); }
    });
  }
});

function openLightbox(src){
  document.getElementById('lightboxImg').src = src;
  document.getElementById('lightbox').classList.add('open');
}
document.addEventListener('DOMContentLoaded', ()=>{
  document.getElementById('lightbox').addEventListener('click', ()=>{
    document.getElementById('lightbox').classList.remove('open');
  });
});

(async function init(){
  await loadState();
  const toggle = document.getElementById('paceToggle');
  if(toggle){ toggle.checked = pacedReading; }
  const SPEED_STEPS = [1, 1.5, 2];
  const slider = document.getElementById('speedSlider');
  const speedLabel = document.getElementById('speedLabel');
  if(slider){ slider.value = String(SPEED_STEPS.indexOf(readSpeed) >= 0 ? SPEED_STEPS.indexOf(readSpeed) : 0); }
  if(speedLabel){ speedLabel.textContent = readSpeed + "x"; }
  render();
})();
</script>
</body>
